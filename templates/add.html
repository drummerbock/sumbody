{% extends "base.html" %}{% block title %}Add a SUM · SUMbody{% endblock %}{% block content %}<section class="narrow"><div class="eyebrow">ADD VALUE</div><h1>Add a SUM</h1><form method="post" class="card form"><label>What did you do?<textarea name="description" rows="3" required autofocus placeholder="Helped someone, practiced, made something, took care of myself…"></textarea></label><label>Where did you add value?<select name="life_area_id" required><option value="">Choose a Life Area</option>{% for a in areas %}<option value="{{a.id}}">{{a.name}}</option>{% endfor %}</select></label><fieldset><legend>How much value?</legend><div class="rating">{% for n in range(1,6) %}<label><input type="radio" name="value" value="{{n}}" required><span>{{n}}</span></label>{% endfor %}</div><small>1 = a small contribution · 5 = a major contribution</small></fieldset><fieldset><legend>Did you communicate or share value?</legend><div class="pills"><label><input type="radio" name="communicated" value="yes"><span>Yes</span></label><label><input type="radio" name="communicated" value="no"><span>No</span></label><label><input type="radio" name="communicated" value="" checked><span>Not sure</span></label></div></fieldset><label>Date<input type="date" name="occurred_on" value="{{today.isoformat()}}" required></label><button>Save SUM</button></form></section>{% endblock %}
