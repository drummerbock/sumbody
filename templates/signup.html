{% extends "base.html" %}
{% block title %}Create Account · Becoming the Heartbeat{% endblock %}
{% block content %}
<section class="login-wrap">
  <div class="eyebrow">BEGIN</div>
  <h1>I am <em>Becoming the Heartbeat.</em></h1>
  <p class="lede">Create your private account. Your Beats, Rhythmos, Life Areas, and reflections belong to you.</p>
  <form method="post" class="card form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Name<input name="name" maxlength="120" autocomplete="name" required autofocus></label>
    <label>Email<input type="email" name="email" autocomplete="email" required></label>
    <label>Password<input type="password" name="password" minlength="10" autocomplete="new-password" required></label>
    <label>Confirm password<input type="password" name="confirm_password" minlength="10" autocomplete="new-password" required></label>
    <button class="primary">Create account</button>
  </form>
  <p class="auth-switch">Already have an account? <a href="{{url_for('login')}}">Sign in</a></p>
</section>
{% endblock %}
