{% extends "base.html" %}{% block title %}Edit Beat · Becoming the Heartbeat{% endblock %}{% block content %}
<section class="edit-beat card">
  <h1>Edit Beat</h1>
  <p class="lede">Adjust the moment or the context around it.</p>
  <form method="post" class="form edit-beat-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Your Beat<textarea name="description" rows="3" required>{{entry.description}}</textarea></label>
    <div class="edit-beat-fields">
      <label>Rhythmos (optional)<select name="life_area_id"><option value="" {% if not entry.life_area_id %}selected{% endif %}>Decide later</option>{% for area in areas %}<option value="{{area.id}}" {% if area.id == entry.life_area_id %}selected{% endif %}>{{area.name}}</option>{% endfor %}</select></label>
      <label>Date<input type="date" name="occurred_on" value="{{entry.occurred_on.isoformat()}}" required></label>
    </div>
    <label class="edit-beat-toggle"><span class="edit-beat-toggle-copy"><strong>Accent this Beat</strong><small>Mark this as a moment that carried extra weight.</small></span><input type="checkbox" name="accented" value="yes" {% if entry.accented %}checked{% endif %}><span class="edit-toggle-track" aria-hidden="true"></span></label>
    <label class="edit-beat-toggle"><span class="edit-beat-toggle-copy"><strong>Shared with someone</strong><small>This Beat involved or was communicated to another person.</small></span><input type="checkbox" name="communicated" value="yes" {% if entry.communicated is sameas true %}checked{% endif %}><span class="edit-toggle-track" aria-hidden="true"></span></label>
    <div class="edit-beat-actions"><a class="secondary" href="{{url_for('history')}}#beats">Cancel</a><button class="primary" type="submit">Save changes</button></div>
  </form>
</section>
{% endblock %}
