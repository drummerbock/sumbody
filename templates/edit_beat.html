{% extends "base.html" %}{% block title %}Edit Beat · Becoming the Heartbeat{% endblock %}{% block content %}
<section class="edit-beat card">
  <h1>Edit Beat</h1>
  <p class="lede">You can return to a moment and add context later.</p>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Your Beat<textarea name="description" rows="3" required>{{entry.description}}</textarea></label>
    <label>Life Area<select name="life_area_id" required>{% for area in areas %}<option value="{{area.id}}" {% if area.id == entry.life_area_id %}selected{% endif %}>{{area.name}}</option>{% endfor %}</select></label>
    <label>Date<input type="date" name="occurred_on" value="{{entry.occurred_on.isoformat()}}" required></label>
    <label><input type="checkbox" name="accented" value="yes" {% if entry.accented %}checked{% endif %}> Accent this Beat</label>
    <label><input type="checkbox" name="communicated" value="yes" {% if entry.communicated is sameas true %}checked{% endif %}> Shared with someone</label>
    <button class="primary" type="submit">Save changes</button>
    <a href="{{url_for('history')}}#beats">Cancel</a>
  </form>
</section>
{% endblock %}
